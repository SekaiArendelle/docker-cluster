# 这个应用的ID
id: jupyter

# 这个应用的名字
name: JupyterLab

logoPath: apps/jupyter.png

# 指定应用类型为web
type: web

# 默认资源：4 核 / 8GB，且不占用 GPU。
# 注意：创建页面的「单节点GPU卡数」字段会被下面 --gres=gpu:0 覆盖；
# 需要 GPU 时在「其他sbatch参数」里填 --gres=gpu:1（后写的选项优先生效）。
slurm:
  options:
    - "--gres=gpu:0"
    - "--cpus-per-task=4"
    - "--mem=8G"

# Web应用的配置
web:
  # 准备脚本
  beforeScript: |
    export PORT=$(get_port)
    export PASSWORD=$(get_password 12)
    export CONFIG_FILE="${PWD}/jupyter_config.py"
    export COMPUTE_HOSTNAME=$(hostname)

  # 运行任务的脚本。可以使用准备脚本定义的变量
  script: |
    export PATH=/data/software/python3.12/bin:$PATH

    umask 077
    cat > "${CONFIG_FILE}" << EOL
    c.ServerApp.ip = '0.0.0.0'
    c.ServerApp.port = ${PORT}
    c.ServerApp.port_retries = 0
    c.ServerApp.token = '${PASSWORD}'
    c.ServerApp.password = ''
    c.ServerApp.open_browser = False
    c.ServerApp.base_url = "${PROXY_BASE_PATH}/${COMPUTE_HOSTNAME}/${PORT}/"
    c.ServerApp.allow_origin = '*'
    c.ServerApp.disable_check_xsrf = True
    EOL

    jupyter lab --config="${CONFIG_FILE}" --notebook-dir="$HOME"

  proxyType: absolute

  # 如何连接应用
  connect:
    method: POST
    path: /login
    formData:
      password: "{{ PASSWORD }}"

attributes:
  - type: text
    name: sbatchOptions
    label: 其他sbatch参数
    required: false
    placeholder: "需要 GPU 填 --gres=gpu:1；要更多核填 --cpus-per-task=8 --mem=16G"
