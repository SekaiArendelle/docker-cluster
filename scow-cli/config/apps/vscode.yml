# 这个应用的ID
id: vscode

# 这个应用的名字
name: VSCode

logoPath: apps/vscode.png

# 指定应用类型为web
type: web

# 默认资源：2 核 / 4GB，且不占用 GPU。
# 注意：创建页面的「单节点GPU卡数」字段会被下面 --gres=gpu:0 覆盖；
# 需要 GPU 时在「其他sbatch参数」里填 --gres=gpu:1（后写的选项优先生效）。
slurm:
  options:
    - "--gres=gpu:0"
    - "--cpus-per-task=2"
    - "--mem=4G"

# Web应用的配置
web:
  # 准备脚本
  beforeScript: |
    export PORT=$(get_port)
    export PASSWORD=$(get_password 12)

  # 运行任务的脚本。可以使用准备脚本定义的变量
  script: |
    PASSWORD=$PASSWORD /data/software/code-server/bin/code-server -vvv --bind-addr 0.0.0.0:$PORT --auth password

  proxyType: relative

  # 如何连接应用
  connect:
    method: POST
    path: /login
    formData:
      password: "{{ PASSWORD }}"

attributes:
  - type: text
    name: sbatchOptions
    label: 其他sbatch参数
    required: false
    placeholder: "需要 GPU 填 --gres=gpu:1；要更多核填 --cpus-per-task=8 --mem=16G"
